<!DOCTYPE html><html><head><meta charset="utf-8">
<title>DRIFT - bitemporal memory replay</title><style>
*{box-sizing:border-box}
body{margin:0;background:#0f1117;color:#e6e9f0;font:13px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{padding:12px 18px;border-bottom:1px solid #232838;display:flex;gap:18px;align-items:center;flex-wrap:wrap}
h1{font-size:15px;margin:0;font-weight:600}
#ctl{display:flex;gap:10px;align-items:center;flex:1;min-width:340px}
input[type=range]{flex:1;accent-color:#2a9d8f}
button{background:#1d2231;color:#e6e9f0;border:1px solid #2f374b;border-radius:6px;padding:5px 11px;font:inherit;cursor:pointer}
button:hover{background:#262d40}
#when{font-variant-numeric:tabular-nums;min-width:190px;color:#9aa4bd}
#wrap{display:flex;height:calc(100vh - 58px)}
.panel{flex:1;position:relative;border-right:1px solid #232838;overflow:hidden}
.panel:last-child{border-right:none}
.ttl{position:absolute;top:10px;left:12px;z-index:2;background:#181c26cc;padding:7px 11px;border-radius:7px;backdrop-filter:blur(3px)}
.ttl b{color:#fff}.ttl span{color:#9aa4bd}
svg{width:100%;height:100%;display:block}
text{fill:#8f98b2;font-size:9px;pointer-events:none}
.e{stroke-width:1.4}
.act{stroke:#2a9d8f;opacity:.75}
.inv{stroke:#c94f5e;stroke-dasharray:4 3;stroke-width:2;opacity:.95}
.pru{stroke:#39405a;opacity:.28;stroke-dasharray:1 4}
#log{width:340px;background:#12151f;border-left:1px solid #232838;overflow-y:auto;padding:12px 14px}
#log h2{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#6e7794;margin:0 0 9px}
.ev{padding:6px 8px;margin-bottom:5px;border-radius:5px;background:#181c26;border-left:3px solid #39405a;font-size:12px}
.ev.a{border-left-color:#2a9d8f}.ev.i{border-left-color:#c94f5e}.ev.p{border-left-color:#5a6382}
.ev .k{color:#6e7794;font-size:10px;text-transform:uppercase;letter-spacing:.06em}
.stat{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:12px;padding-bottom:11px;border-bottom:1px solid #232838}
.stat div{font-size:11px;color:#6e7794}.stat b{display:block;font-size:16px;color:#e6e9f0;font-variant-numeric:tabular-nums}
.lgd{display:flex;gap:14px;font-size:11px;color:#9aa4bd;align-items:center}
.sw{display:inline-block;width:13px;height:3px;margin-right:5px;vertical-align:middle}
</style></head><body>
<header>
  <h1>DRIFT · bitemporal memory replay</h1>
  <div id="ctl">
    <button id="play">▶ Play</button>
    <button id="next">Next supersession →</button>
    <input type="range" id="sl" min="0" value="0">
    <span id="when"></span>
  </div>
  <div class="lgd">
    <span><i class="sw" style="background:#2a9d8f"></i>active</span>
    <span><i class="sw" style="background:#c94f5e"></i>superseded</span>
    <span><i class="sw" style="background:#39405a"></i>pruned</span>
  </div>
</header>
<div id="wrap"><div id="panels" style="display:flex;flex:1"></div><div id="log"></div></div>
<script>
const D = {"times": ["2024-01-15", "2024-01-25", "2024-01-27", "2024-02-09", "2024-02-14", "2024-02-24", "2024-02-29", "2024-03-10", "2024-03-13"], "panels": [{"name": "P1:ttl_days=14", "policy": "P1:ttl_days=14", "model": "", "accuracy": 0.14285714285714285, "staleness": 0.0, "nodes": [{"id": "alice", "label": "Alice", "deg": 9}, {"id": "bob", "label": "Bob", "deg": 7}, {"id": "carol", "label": "Carol", "deg": 6}, {"id": "dan", "label": "Dan", "deg": 6}, {"id": "my favorite hobby is painting landscapes.", "label": "My favorite hobby is painting landscapes.", "deg": 2}, {"id": "biology", "label": "biology", "deg": 2}, {"id": "i play guitar in a local band, my favorite instrument.", "label": "I play guitar in a local band, my favorite instrument.", "deg": 2}, {"id": "boston", "label": "Boston", "deg": 1}, {"id": "acme corp", "label": "Acme Corp", "deg": 1}, {"id": "puppy", "label": "puppy", "deg": 1}, {"id": "i love hiking on weekends.", "label": "I love hiking on weekends.", "deg": 1}, {"id": "initech", "label": "Initech", "deg": 1}, {"id": "austin", "label": "Austin", "deg": 1}, {"id": "the weather has been rainy lately.", "label": "The weather has been rainy lately.", "deg": 1}, {"id": "i started learning spanish this month.", "label": "I started learning Spanish this month.", "deg": 1}, {"id": "kitten", "label": "kitten", "deg": 1}, {"id": "my puppy max learned to fetch.", "label": "My puppy Max learned to fetch.", "deg": 1}, {"id": "seattle recently and i live downtown", "label": "Seattle recently and I live downtown", "deg": 1}, {"id": "globex industries", "label": "Globex Industries", "deg": 1}, {"id": "denver and i live near the mountains", "label": "Denver and I live near the mountains", "deg": 1}, {"id": "initech has been stressful lately", "label": "Initech has been stressful lately", "deg": 1}, {"id": "the coffee shops in my new neighborhood are amazing.", "label": "The coffee shops in my new neighborhood are amazing.", "deg": 1}, {"id": "i visited my grandmother in chicago last weekend.", "label": "I visited my grandmother in Chicago last weekend.", "deg": 1}, {"id": "denver winters are colder than expected.", "label": "Denver winters are colder than expected.", "deg": 1}, {"id": "hooli", "label": "Hooli", "deg": 1}, {"id": "i got promoted to senior engineer at globex industries.", "label": "I got promoted to senior engineer at Globex Industries.", "deg": 1}, {"id": "i am training max for an agility competition.", "label": "I am training Max for an agility competition.", "deg": 1}, {"id": "my band released our first album called midnight drive.", "label": "My band released our first album called Midnight Drive.", "deg": 1}, {"id": "my mentor at work is very supportive.", "label": "My mentor at work is very supportive.", "deg": 1}], "edges": [{"s": "alice", "o": "my favorite hobby is painting landscapes.", "p": "stated", "txt": "Alice: My favorite hobby is painting landscapes.", "in": 0, "inv": null, "pr": 8, "lg": true}, {"s": "alice", "o": "boston", "p": "lives_in", "txt": "Alice: I live in Boston, the city is great for museums.", "in": 0, "inv": 3, "pr": 8, "lg": true}, {"s": "alice", "o": "acme corp", "p": "works_at", "txt": "Alice: I work at Acme Corp, the company makes robotics.", "in": 0, "inv": 3, "pr": 8, "lg": true}, {"s": "bob", "o": "puppy", "p": "owns_pet", "txt": "Bob: I adopted a puppy named Max, my first pet.", "in": 0, "inv": null, "pr": 8, "lg": true}, {"s": "bob", "o": "biology", "p": "studies", "txt": "Bob: I am studying biology at Harvard.", "in": 0, "inv": null, "pr": 8, "lg": true}, {"s": "carol", "o": "i love hiking on weekends.", "p": "stated", "txt": "Carol: I love hiking on weekends.", "in": 0, "inv": null, "pr": 8, "lg": true}, {"s": "dan", "o": "i play guitar in a local band, my favorite instrument.", "p": "stated", "txt": "Dan: I play guitar in a local band, my favorite instrument.", "in": 0, "inv": null, "pr": 8, "lg": true}, {"s": "carol", "o": "initech", "p": "works_at", "txt": "Carol: I work at Initech, the company audits spreadsheets.", "in": 0, "inv": null, "pr": 8, "lg": true}, {"s": "dan", "o": "austin", "p": "lives_in", "txt": "Dan: I live in Austin, the city has amazing tacos.", "in": 0, "inv": null, "pr": 8, "lg": true}, {"s": "alice", "o": "my favorite hobby is painting landscapes.", "p": "stated", "txt": "Alice: My favorite hobby is painting landscapes.", "in": 1, "inv": null, "pr": 8, "lg": true}, {"s": "bob", "o": "the weather has been rainy lately.", "p": "stated", "txt": "Bob: The weather has been rainy lately.", "in": 1, "inv": null, "pr": 8, "lg": true}, {"s": "alice", "o": "i started learning spanish this month.", "p": "stated", "txt": "Alice: I started learning Spanish this month.", "in": 1, "inv": null, "pr": 8, "lg": true}, {"s": "dan", "o": "i play guitar in a local band, my favorite instrument.", "p": "stated", "txt": "Dan: I play guitar in a local band, my favorite instrument.", "in": 2, "inv": null, "pr": 8, "lg": true}, {"s": "carol", "o": "kitten", "p": "owns_pet", "txt": "Carol: I adopted a kitten named Whiskers, my first pet.", "in": 2, "inv": null, "pr": 8, "lg": true}, {"s": "bob", "o": "my puppy max learned to fetch.", "p": "stated", "txt": "Bob: My puppy Max learned to fetch.", "in": 3, "inv": null, "pr": 8, "lg": true}, {"s": "alice", "o": "seattle recently and i live downtown", "p": "lives_in", "txt": "Alice: I moved to Seattle recently and I live downtown.", "in": 3, "inv": null, "pr": 8, "lg": true}, {"s": "alice", "o": "globex industries", "p": "works_at", "txt": "Alice: I now work at Globex Industries.", "in": 3, "inv": null, "pr": 8, "lg": true}, {"s": "dan", "o": "denver and i live near the mountains", "p": "lives_in", "txt": "Dan: I just moved to Denver and I live near the mountains.", "in": 4, "inv": null, "pr": 8, "lg": true}, {"s": "carol", "o": "initech has been stressful lately", "p": "works_at", "txt": "Carol: Work at Initech has been stressful lately.", "in": 4, "inv": 6, "pr": 8, "lg": true}, {"s": "alice", "o": "the coffee shops in my new neighborhood are amazing.", "p": "stated", "txt": "Alice: The coffee shops in my new neighborhood are amazing.", "in": 5, "inv": null, "pr": 8, "lg": true}, {"s": "bob", "o": "i visited my grandmother in chicago last weekend.", "p": "stated", "txt": "Bob: I visited my grandmother in Chicago last weekend.", "in": 5, "inv": null, "pr": 8, "lg": true}, {"s": "bob", "o": "biology", "p": "studies", "txt": "Bob: I am studying biology at Harvard.", "in": 5, "inv": null, "pr": 8, "lg": true}, {"s": "dan", "o": "denver winters are colder than expected.", "p": "stated", "txt": "Dan: Denver winters are colder than expected.", "in": 6, "inv": null, "pr": null, "lg": false}, {"s": "carol", "o": "hooli", "p": "works_at", "txt": "Carol: I quit and now work for Hooli as a product manager.", "in": 6, "inv": null, "pr": null, "lg": false}, {"s": "alice", "o": "i got promoted to senior engineer at globex industries.", "p": "stated", "txt": "Alice: I got promoted to senior engineer at Globex Industries.", "in": 7, "inv": null, "pr": null, "lg": false}, {"s": "bob", "o": "i am training max for an agility competition.", "p": "stated", "txt": "Bob: I am training Max for an agility competition.", "in": 7, "inv": null, "pr": null, "lg": false}, {"s": "dan", "o": "my band released our first album called midnight drive.", "p": "stated", "txt": "Dan: My band released our first album called Midnight Drive.", "in": 8, "inv": null, "pr": null, "lg": false}, {"s": "carol", "o": "my mentor at work is very supportive.", "p": "stated", "txt": "Carol: My mentor at work is very supportive.", "in": 8, "inv": null, "pr": null, "lg": false}], "curves": []}], "events": [3, 6]};
const P = D.panels, T = D.times;
const sl = document.getElementById('sl'); sl.max = T.length - 1;

// One layout per panel, solved once over the FINAL graph and then frozen.
// Recomputing per frame would reshuffle the map on every slider step and make
// the replay unreadable -- the point is to watch one map fill in.
P.forEach(p => {
  const W = 900, H = 700, idx = {};
  p.nodes.forEach((n, i) => { idx[n.id] = i;
    n.x = W/2 + Math.cos(i*2.4)*(70+7*i%330); n.y = H/2 + Math.sin(i*2.4)*(55+5*i%260);
    n.vx = 0; n.vy = 0; });
  p.idx = idx; p.W = W; p.H = H;
  for (let it = 0; it < 220; it++) {
    p.nodes.forEach(a => {
      p.nodes.forEach(b => { if (a === b) return;
        let dx = a.x-b.x, dy = a.y-b.y, d2 = dx*dx+dy*dy+.01, f = 900/d2;
        a.vx += dx*f/Math.sqrt(d2); a.vy += dy*f/Math.sqrt(d2); });
      a.vx += (W/2-a.x)*.003; a.vy += (H/2-a.y)*.003; });
    p.edges.forEach(e => {
      const a = p.nodes[idx[e.s]], b = p.nodes[idx[e.o]]; if (!a||!b) return;
      const dx = b.x-a.x, dy = b.y-a.y, d = Math.sqrt(dx*dx+dy*dy)+.01, f = (d-95)*.012;
      a.vx += dx/d*f; a.vy += dy/d*f; b.vx -= dx/d*f; b.vy -= dy/d*f; });
    p.nodes.forEach(n => { n.x += n.vx *= .55; n.y += n.vy *= .55;
      n.x = Math.max(26, Math.min(W-26, n.x)); n.y = Math.max(22, Math.min(H-22, n.y)); });
  }
});

document.getElementById('panels').innerHTML = P.map((p, i) => `
  <div class="panel"><div class="ttl"><b>${p.policy}</b>
    <span>${p.model ? '· ' + p.model.split('/').pop() : ''}</span><br>
    <span id="pstat${i}"></span></div>
  <svg id="svg${i}" viewBox="0 0 ${p.W} ${p.H}" preserveAspectRatio="xMidYMid meet"></svg></div>`).join('');

// A fact's class at session t is decided purely by comparing t against the
// timestamps the fact itself carries -- no simulation, no replay of the run.
function state(e, t) {
  if (e.in === null || e.in > t) return null;         // not yet learned
  if (e.pr !== null && e.pr <= t) return 'pru';       // policy dropped it
  if (e.inv !== null && e.inv <= t) return 'inv';     // valid window closed
  return 'act';
}

function draw(t) {
  P.forEach((p, i) => {
    const live = {}, parts = [];
    p.edges.forEach(e => {
      const st = state(e, t); if (!st) return;
      const a = p.nodes[p.idx[e.s]], b = p.nodes[p.idx[e.o]]; if (!a||!b) return;
      if (st !== 'pru') { live[e.s] = 1; live[e.o] = 1; }
      parts.push(`<line class="e ${st}" x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}"><title>${esc(e.txt)}</title></line>`);
    });
    const ns = p.nodes.filter(n => live[n.id]).map(n =>
      `<g><circle cx="${n.x}" cy="${n.y}" r="${3.5+Math.min(9, n.deg)}" fill="#2a9d8f" opacity=".82"><title>${esc(n.label)}</title></circle>` +
      (n.deg > 2 ? `<text x="${n.x+8}" y="${n.y+3}">${esc(n.label).slice(0,26)}</text>` : '') + `</g>`).join('');
    document.getElementById('svg'+i).innerHTML = parts.join('') + ns;

    const c = p.curves[Math.min(t, p.curves.length-1)] || {};
    document.getElementById('pstat'+i).textContent =
      `${c.active_facts ?? '–'} active · ${c.invalidated_active ?? '–'} superseded · ${c.pruned ?? '–'} pruned` +
      (c.write_rejections ? ` · ${c.write_rejections} writes rejected` : '');
  });
  renderLog(t);
  document.getElementById('when').textContent = `session ${t+1}/${T.length} · ${T[t]}`;
}

function renderLog(t) {
  const c0 = P[0].curves[Math.min(t, P[0].curves.length-1)] || {};
  let h = `<div class="stat">
    <div>ACTIVE<b>${c0.active_facts ?? '–'}</b></div>
    <div>SUPERSEDED<b>${c0.invalidated_active ?? '–'}</b></div>
    <div>PRUNED<b>${c0.pruned ?? '–'}</b></div>
    <div>REJECTED<b>${c0.write_rejections ?? 0}</b></div></div>
    <h2>Session ${t+1} - ${T[t]}</h2>`;
  let n = 0;
  P.forEach(p => {
    const pre = P.length > 1 ? `<span class="k">${p.policy}</span> ` : '';
    p.edges.forEach(e => {
      if (e.inv === t) { h += `<div class="ev i">${pre}<span class="k">superseded</span><br>${esc(e.txt)}</div>`; n++; }
    });
    p.edges.forEach(e => {
      if (e.pr === t && !e.lg) { h += `<div class="ev p">${pre}<span class="k">pruned</span><br>${esc(e.txt)}</div>`; n++; }
    });
    p.edges.filter(e => e.in === t).slice(0, 8).forEach(e => {
      h += `<div class="ev a">${pre}<span class="k">learned</span><br>${esc(e.txt)}</div>`; n++;
    });
  });
  if (!n) h += `<div class="ev">no memory events this session</div>`;
  document.getElementById('log').innerHTML = h;
}

const esc = s => String(s).replace(/[<>&"]/g, c => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));

sl.oninput = () => draw(+sl.value);
document.getElementById('next').onclick = () => {
  const t = +sl.value, nx = D.events.find(e => e > t);
  sl.value = nx === undefined ? (D.events[0] ?? 0) : nx; draw(+sl.value);
};
let timer = null;
document.getElementById('play').onclick = e => {
  if (timer) { clearInterval(timer); timer = null; e.target.textContent = '▶ Play'; return; }
  e.target.textContent = '❚❚ Pause';
  timer = setInterval(() => {
    if (+sl.value >= sl.max) { clearInterval(timer); timer = null; e.target.textContent = '▶ Play'; return; }
    sl.value = +sl.value + 1; draw(+sl.value);
  }, 650);
};
draw(0);
</script></body></html>
