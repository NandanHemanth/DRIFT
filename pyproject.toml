[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "drift-memory"
version = "1.0.0"
description = "DRIFT (Decay Rates In Forgetful biTemporal memory): a controlled framework for choosing a forgetting policy in LLM agent memory"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Nandan Hemanth" }, { name = "Hao Wang" }]
keywords = ["llm", "agents", "memory", "forgetting", "knowledge-graph", "bitemporal"]
classifiers = [
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []  # the core is stdlib-only by design; see README "Zero dependencies"

[project.optional-dependencies]
dev = ["pytest>=7.0"]
analysis = ["matplotlib>=3.7"]
all = ["pytest>=7.0", "matplotlib>=3.7"]

[project.urls]
Repository = "https://github.com/nandanhemanth/DRIFT"

[project.scripts]
drift-run = "drift.runner:main"
drift-swarm = "drift.swarm:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["drift*", "analysis*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
